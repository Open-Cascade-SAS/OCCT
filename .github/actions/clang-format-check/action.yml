name: 'Clang-Tidy and Clang-Format Code Check'
description: 'Run clang-tidy and clang-format on changed source files'
inputs:
  base-ref:
    description: 'Base reference to compare changes against'
    required: true
    default: 'master'
  file-pattern:
    description: 'Pattern to match files for clang-tidy and clang-format checks'
    required: false
    default: '^(src)/.*\.(cpp|hxx|cxx|lxx|h|pxx|hpp|gxx)$'
  clang-tidy-version:
    description: 'Required clang-tidy major version'
    required: false
    default: '20'
  clang-format-version:
    description: 'Required clang-format major version'
    required: false
    default: '20'

outputs:
  has-changes:
    description: 'Whether any files needed formatting'
    value: ${{ steps.git-check.outputs.has_changes }}

runs:
  using: "composite"
  steps:
    - name: Check clang-tidy version
      shell: pwsh
      run: |
        $version = clang-tidy --version
        $versionText = $version | Out-String
        Write-Output "Detected clang-tidy version: $versionText"
        if ($versionText -notmatch "version\s+${{ inputs.clang-tidy-version }}\.") {
          echo "::error::Wrong clang-tidy version. Expected major ${{ inputs.clang-tidy-version }}"
          Write-Output "Error: Version mismatch - expected major ${{ inputs.clang-tidy-version }}"
          exit 1
        }

    - name: Check clang-format version
      shell: pwsh
      run: |
        $version = clang-format --version
        $versionText = $version | Out-String
        Write-Output "Detected clang-format version: $versionText"
        if ($versionText -notmatch "version\s+${{ inputs.clang-format-version }}\.") {
          echo "::error::Wrong clang-format version. Expected major ${{ inputs.clang-format-version }}"
          Write-Output "Error: Version mismatch - expected major ${{ inputs.clang-format-version }}"
          exit 1
        }

    - name: Get changed files
      id: changed-files
      shell: pwsh
      run: |
        $allChangedFiles = git diff --name-only origin/${{ inputs.base-ref }} HEAD |
          Where-Object { Test-Path $_ }

        $tidyFiles = $allChangedFiles |
          Where-Object { $_ -match '${{ inputs.file-pattern }}' }

        $changedFiles = $allChangedFiles |
          Where-Object { $_ -match '${{ inputs.file-pattern }}' } |
          Where-Object { Test-Path $_ }
        
        $tidyFiles | Set-Content "changed_tidy_files.txt"
        $changedFiles | Set-Content "changed_files.txt"

        if ($tidyFiles.Count -gt 0) {
          echo "has_tidy_files=true" >> $env:GITHUB_OUTPUT
        }
        if ($changedFiles.Count -gt 0) {
          echo "has_files=true" >> $env:GITHUB_OUTPUT
        }

    - name: Configure CMake database for clang-tidy
      if: steps.changed-files.outputs.has_tidy_files == 'true'
      shell: pwsh
      run: |
        cmake -S . -B build-clang-tidy -G Ninja `
          -D CMAKE_BUILD_TYPE=Release `
          -D CMAKE_EXPORT_COMPILE_COMMANDS=ON `
          -D BUILD_MODULE_Draw=OFF `
          -D BUILD_GTEST=OFF `
          -D BUILD_USE_PCH=OFF

    - name: Run clang-tidy with auto-fixes
      if: steps.changed-files.outputs.has_tidy_files == 'true'
      shell: pwsh
      run: |
        # Run in a single thread for deterministic fixes and lower CI load.
        $files = Get-Content "changed_tidy_files.txt" | Where-Object { Test-Path $_ }
        foreach ($file in $files) {
          clang-tidy --config-file=.clang-tidy -p build-clang-tidy --fix --format-style=file $file
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
        }

    - name: Validate and add license headers
      if: steps.changed-files.outputs.has_files == 'true'
      shell: pwsh
      run: |
        python3 .github/actions/scripts/validate-license.py --file-list changed_files.txt --fix

    - name: Check formatting
      if: steps.changed-files.outputs.has_files == 'true'
      shell: pwsh
      run: |
        $files = Get-Content "changed_files.txt" | Where-Object { Test-Path $_ }
        $files | ForEach-Object -ThrottleLimit 8 -Parallel {
          clang-format -i -style=file $_
        }

    - name: Clean up duplicate includes
      if: steps.changed-files.outputs.has_files == 'true'
      shell: pwsh
      run: |
        python3 .github/actions/scripts/cleanup-includes.py --file-list changed_files.txt

    - name: Re-run clang-format after include cleanup
      if: steps.changed-files.outputs.has_files == 'true'
      shell: pwsh
      run: |
        $files = Get-Content "changed_files.txt" | Where-Object { Test-Path $_ }
        $files | ForEach-Object -ThrottleLimit 8 -Parallel {
          clang-format -i -style=file $_
        }

    - name: Remove empty lines after Standard_DEPRECATED
      if: steps.changed-files.outputs.has_files == 'true'
      shell: pwsh
      run: |
        $files = Get-Content "changed_files.txt" | Where-Object { Test-Path $_ }
        $files | ForEach-Object {
          $content = Get-Content $_ -Raw
          $pattern = '(Standard_DEPRECATED\s*\(\s*"[^"]*"(?:\s*"[^"]*")*\s*\)\n)\n+'
          $newContent = $content -replace $pattern, '$1'
          if ($content -ne $newContent) {
            Set-Content -Path $_ -Value $newContent -NoNewline
          }
        }

    - name: Check git status
      id: git-check
      if: steps.changed-files.outputs.has_files == 'true'
      shell: pwsh
      run: |
        git diff > format.patch
        if ((Get-Item format.patch).length -gt 0) {
          echo "has_changes=true" >> $env:GITHUB_OUTPUT
        }

    - name: Upload patch
      if: steps.git-check.outputs.has_changes == 'true'
      uses: actions/upload-artifact@v4.6.2
      with:
        name: format-patch
        path: format.patch

    - name: Failing step for formatting issues
      if: steps.git-check.outputs.has_changes == 'true'
      shell: pwsh
      run: |
        echo "::error::Files need formatting. To fix: 1. Download format.patch 2. \"git apply format.patch\" 3. Commit and push"
        exit 1

branding:
  icon: 'check-square'
  color: 'green'
