name: 'Clang-Format Code Check'
description: 'Check code formatting of all tracked source files using clang-format'
inputs:
  base-ref:
    description: 'Base reference to compare changes against'
    required: true
    default: 'master'
  file-pattern:
    description: 'Pattern to match files for formatting check'
    required: false
    default: '^(src)/.*\.(cpp|hxx|cxx|lxx|h|pxx|hpp|gxx)$'
  clang-format-version:
    description: 'Required clang-format version'
    required: false
    default: '18.1.8'

outputs:
  has-changes:
    description: 'Whether any files needed formatting'
    value: ${{ steps.git-check.outputs.has_changes }}

runs:
  using: "composite"
  steps:
    - name: Install clang-format
      shell: pwsh
      env:
        CLANG_FORMAT_VERSION: ${{ inputs.clang-format-version }}
      run: |
        $installDir = Join-Path $env:RUNNER_TEMP 'clang-format'
        python3 -m pip install --only-binary=:all: --no-deps --target $installDir "clang-format==$env:CLANG_FORMAT_VERSION"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Join-Path $installDir 'clang_format/data/bin' >> $env:GITHUB_PATH

    - name: Check clang-format version
      shell: pwsh
      env:
        CLANG_FORMAT_VERSION: ${{ inputs.clang-format-version }}
      run: |
        $version = clang-format --version
        Write-Output "Detected clang-format version: $version"
        $expected = [regex]::Escape($env:CLANG_FORMAT_VERSION)
        if ($LASTEXITCODE -ne 0 -or $version -notmatch "\bversion $expected(?=\s|$)") {
          throw "Expected clang-format $env:CLANG_FORMAT_VERSION"
        }

    - name: Get changed files
      id: changed-files
      shell: pwsh
      run: |
        $changedFiles = git diff --name-only origin/${{ inputs.base-ref }} HEAD |
          Where-Object { $_ -match '${{ inputs.file-pattern }}' } |
          Where-Object { Test-Path $_ }
        
        $changedFiles | Set-Content "changed_files.txt"
        if ($changedFiles.Count -gt 0) {
          echo "has_files=true" >> $env:GITHUB_OUTPUT
        }

    - name: Validate and add license headers and source reuse notices
      if: steps.changed-files.outputs.has_files == 'true'
      shell: pwsh
      run: |
        python3 .github/actions/scripts/validate-license.py --file-list changed_files.txt --fix

    - name: Check formatting across the codebase
      shell: pwsh
      run: |
        $files = @(git ls-files | Where-Object { $_ -match '${{ inputs.file-pattern }}' })
        $batchSize = [int][Math]::Ceiling($files.Count / 8)
        $batches = @(for ($start = 0; $start -lt $files.Count; $start += $batchSize) {
          $end = [Math]::Min($start + $batchSize, $files.Count) - 1
          $list = Join-Path $env:RUNNER_TEMP "clang-format-$start.txt"
          [IO.File]::WriteAllText($list, ($files[$start..$end] -join "`n"))
          $list
        })
        $exitCodes = @($batches | ForEach-Object -ThrottleLimit 8 -Parallel {
          (Start-Process clang-format "-i -style=file --files=`"$_`"" -NoNewWindow -Wait -PassThru).ExitCode
        })
        if ($exitCodes.Count -ne $batches.Count -or ($exitCodes -ne 0)) {
          throw 'clang-format failed'
        }

    - name: Clean up duplicate includes
      if: steps.changed-files.outputs.has_files == 'true'
      shell: pwsh
      run: |
        python3 .github/actions/scripts/cleanup-includes.py --file-list changed_files.txt

    - name: Re-run clang-format after include cleanup
      if: steps.changed-files.outputs.has_files == 'true'
      shell: pwsh
      run: |
        $files = Get-Content "changed_files.txt" | Where-Object { Test-Path $_ }
        $files | ForEach-Object -ThrottleLimit 8 -Parallel {
          clang-format -i -style=file $_
        }

    - name: Check git status
      id: git-check
      shell: pwsh
      run: |
        git diff > format.patch
        if ((Get-Item format.patch).length -gt 0) {
          echo "has_changes=true" >> $env:GITHUB_OUTPUT
        }

    - name: Upload patch
      if: steps.git-check.outputs.has_changes == 'true'
      uses: actions/upload-artifact@v4.6.2
      with:
        name: format-patch
        path: format.patch

    - name: Failing step for formatting issues
      if: steps.git-check.outputs.has_changes == 'true'
      shell: pwsh
      run: |
        echo "::error::Files need formatting. To fix: 1. Download format.patch 2. \"git apply format.patch\" 3. Commit and push"
        exit 1

branding:
  icon: 'check-square'
  color: 'green'
